apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    app: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      initContainers:
      # --- INIT: Fix Permissions ---
      - name: fix-permissions
        image: busybox:latest
        command: ['sh', '-c', 'rm -rf /data/* && chown -R 1000:1000 /data && echo "✅ Limpieza y Permisos OK"']
        volumeMounts:
        - name: n8n-storage
          mountPath: /data
      
      containers:
      # --- CONTENEDOR 1: N8N (Main) ---
      - name: n8n
        image: n8nio/n8n:latest
        ports:
        - containerPort: 5678
        env:
        - name: N8N_PORT
          value: "5678"
        - name: GENERIC_TIMEZONE
          value: "America/Argentina/Buenos_Aires"
        - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
          value: "true"
        # Variables Secretas
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: GEMINI_API_KEY
        - name: SLACK_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: SLACK_BOT_TOKEN
        - name: SLACK_CHANNEL_ID
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: SLACK_CHANNEL_ID
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: GITHUB_TOKEN
        - name: GITHUB_OWNER
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: GITHUB_OWNER
        - name: GITHUB_REPO
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: GITHUB_REPO
        - name: GITHUB_FILE_PATH
          valueFrom:
            secretKeyRef:
              name: n8n-secrets
              key: GITHUB_FILE_PATH
        
        volumeMounts:
        - name: n8n-storage
          mountPath: /home/node/.n8n
        - name: import-data
          mountPath: /import

        # LÓGICA DE SINCRONIZACIÓN (MAIN)
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "🧹 Main: Iniciando limpieza..."
            # 1. LIMPIEZA NUCLEAR: Borrar DB vieja para que no queden 'fantasmas'
            rm -f /home/node/.n8n/database.sqlite
            
            # 2. Inicializar DB (Truco: Importar un workflow vacío fuerza las migraciones)
            echo "🏗️ Main: Inicializando base de datos..."
            echo '{"nodes":[],"connections":{}}' > /tmp/init.json
            n8n import:workflow --input=/tmp/init.json || echo "⚠️ Import inicial falló (esperable), pero la DB debería estar lista."
            
            # 3. Avisar al sidecar que estamos listos para el hack de activación
            touch /home/node/.n8n/ready_for_hack
            echo "✋ Main: Esperando al sidecar..."
            
            # 4. Esperar a que el sidecar termine
            while [ ! -f /home/node/.n8n/hacked ]; do sleep 1; done
            
            # 5. Arrancar servidor
            echo "🚀 Main: DB activada. Arrancando motor..."
            n8n

      # --- CONTENEDOR 2: SIDECAR ACTIVATOR (Python) ---
      - name: activator
        image: python:3.9-slim
        volumeMounts:
        - name: n8n-storage
          mountPath: /data
        - name: import-data
          mountPath: /import
        
        # LÓGICA DE SINCRONIZACIÓN (SIDECAR)
        command: ["/bin/sh", "-c"]
        args:
          - |
            echo "🕵️ Sidecar: Esperando señal..."
            
            # 1. Esperar a que n8n cree la DB nueva
            while [ ! -f /data/ready_for_hack ]; do sleep 1; done
            
            # 2. Esperar a que la tabla workflow_entity exista
            echo "🕵️ Sidecar: Esperando a que se creen las tablas..."
            python -c "
            import sqlite3
            import time
            import json
            import glob
            import os
            import datetime
            
            DB_PATH = '/data/database.sqlite'
            IMPORT_DIR = '/import'
            
            def wait_for_db():
                max_attempts = 120
                for i in range(max_attempts):
                    try:
                        conn = sqlite3.connect(DB_PATH)
                        cursor = conn.cursor()
                        cursor.execute('SELECT COUNT(*) FROM project')
                        count = cursor.fetchone()[0]
                        conn.close()
                        if count > 0:
                            print(f'✅ DB lista. Encontrados {count} proyectos.')
                            return True
                    except Exception as e:
                        if i % 10 == 0:
                            print(f'⏳ Esperando DB... ({i}s)')
                        time.sleep(1)
                return False

            def get_personal_project(cursor):
                # Buscar el proyecto personal del usuario
                cursor.execute(\"SELECT id FROM project WHERE type='personal' LIMIT 1\")
                row = cursor.fetchone()
                return row[0] if row else None

            def import_workflows():
                if not wait_for_db():
                    print('❌ Timeout esperando DB')
                    exit(1)
                
                conn = sqlite3.connect(DB_PATH)
                cursor = conn.cursor()
                
                # Obtener ID del proyecto personal
                project_id = get_personal_project(cursor)
                if not project_id:
                    print('⚠️  No se encontró proyecto personal. Intentando esperar un poco más...')
                    time.sleep(10)
                    project_id = get_personal_project(cursor)
                
                if not project_id:
                    print('❌ ERROR CRITICO: No se encontró proyecto personal para asignar workflows.')
                    # No salimos, intentamos importar igual aunque queden huérfanos (mejor que nada)
                else:
                    print(f'✅ Proyecto Personal encontrado: {project_id}')

                files = glob.glob(os.path.join(IMPORT_DIR, '*.json'))
                print(f'📂 Encontrados {len(files)} archivos para importar.')
                
                now = datetime.datetime.now().strftime('%Y-%m-%d %H:%M:%S.%f')[:-3]
                
                for file_path in files:
                    try:
                        with open(file_path, 'r') as f:
                            wf = json.load(f)
                        
                        wf_id = wf.get('id')
                        name = wf.get('name')
                        nodes = json.dumps(wf.get('nodes', []))
                        connections = json.dumps(wf.get('connections', {}))
                        version_id = wf.get('versionId', '1')
                        
                        print(f'🔄 Importando: {name} ({wf_id})...')
                        
                        # 1. Insertar en workflow_entity
                        cursor.execute('''
                            INSERT OR REPLACE INTO workflow_entity 
                            (id, name, active, nodes, connections, versionId, createdAt, updatedAt, versionCounter)
                            VALUES (?, ?, 1, ?, ?, ?, ?, ?, 1)
                        ''', (wf_id, name, nodes, connections, version_id, now, now))
                        
                        # 2. Insertar en workflow_history (para evitar error de FK si n8n lo busca)
                        cursor.execute('''
                            INSERT OR IGNORE INTO workflow_history 
                            (workflowId, versionId, nodes, connections, name, authors, createdAt, updatedAt, autosaved)
                            VALUES (?, ?, ?, ?, ?, '', ?, ?, 0)
                        ''', (wf_id, version_id, nodes, connections, name, now, now))
                        
                        # 3. Asignar al usuario (shared_workflow)
                        if project_id:
                            cursor.execute('''
                                INSERT OR REPLACE INTO shared_workflow
                                (workflowId, projectId, role, createdAt, updatedAt)
                                VALUES (?, ?, 'workflow:owner', ?, ?)
                            ''', (wf_id, project_id, now, now))
                            print(f'   👤 Asignado a proyecto {project_id}')
                        
                    except Exception as e:
                        print(f'❌ Error importando {file_path}: {e}')
                
                conn.commit()
                conn.close()
                print('🎉 Importación SQL finalizada.')

            import_workflows()
            "
            
            # 4. Avisar a n8n que puede arrancar
            touch /data/hacked
            echo "🕵️ Sidecar: Trabajo terminado."
            sleep 3600

      volumes:
      - name: n8n-storage
        persistentVolumeClaim:
          claimName: n8n-pvc
      - name: import-data
        configMap:
          name: n8n-import-data
---
apiVersion: v1
kind: Service
metadata:
  name: n8n-svc
spec:
  selector:
    app: n8n
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5678
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi